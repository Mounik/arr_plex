###############################################
# Common Keys for all apps
###############################################

x-common-keys: &common-keys
    restart: unless-stopped
    logging:
      driver: json-file
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/Paris}
    dns:
      - 1.1.1.1
      - 1.0.0.1
    networks:
      - arr_plex

services:
###############################################
# RADARR - Movies
###############################################
  radarr:
    <<: *common-keys
    container_name: radarr
    image: ghcr.io/hotio/radarr:release-5.21.1
    ports:
      - ${RADARR_PORT:-7878}:7878
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/appdata/radarr:/config
      - /data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7878/ping"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

###############################################
# SONARR - TV Shows
###############################################

  sonarr:
    <<: *common-keys
    container_name: sonarr
    image: ghcr.io/hotio/sonarr:release-4.0.14
    ports:
      - ${SONARR_PORT:-8989}:8989
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/appdata/sonarr:/config
      - /data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989/ping"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

###############################################
# LIDARR - Music
###############################################

  lidarr:
    <<: *common-keys
    container_name: lidarr
    image: ghcr.io/hotio/lidarr:release-2.9.6
    ports:
      - ${LIDARR_PORT:-8686}:8686
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/appdata/lidarr:/config
      - /data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8686/ping"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

###############################################
# BAZARR - Subtitles
###############################################

  bazarr:
    <<: *common-keys
    container_name: bazarr
    image: ghcr.io/hotio/bazarr:release-1.5.1
    ports:
      - ${BAZARR_PORT:-6767}:6767
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/appdata/bazarr:/config
      - /data/media:/data/media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6767/ping"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

###############################################
# PROWLARR - Indexer Manager
###############################################

  prowlarr:
    <<: *common-keys
    container_name: prowlarr
    image: ghcr.io/hotio/prowlarr:release-1.32.2
    ports:
      - ${PROWLARR_PORT:-9696}:9696
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/appdata/prowlarr:/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9696/ping"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

###############################################
# QBITTORRENT - Downloader
###############################################

  qbittorrent:
    <<: *common-keys
    container_name: qbittorrent
    image: ghcr.io/hotio/qbittorrent:release-5.0.4
    ports:
      - ${QBITTORRENT_WEBUI_PORT:-8080}:8080
      - ${QBITTORRENT_TORRENT_PORT:-6881}:6881
      - ${QBITTORRENT_TORRENT_PORT:-6881}:6881/udp
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/Paris}
      WEBUI_PORT: 8080
      TORRENTING_PORT: ${QBITTORRENT_TORRENT_PORT:-6881}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/appdata/qbittorrent:/config
      - /data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

###################################
# FLARESOLVERR - Cloudflare Bypass
###################################

  flaresolverr:
    <<: *common-keys
    container_name: flaresolverr
    image: ghcr.io/flaresolverr/flaresolverr:v3.3.21
    ports:
      - ${FLARESOLVERR_PORT:-8191}:8191
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/Paris}
      LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8191/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

###############################################
# SEERR - Request Manager
###############################################

  seerr:
    container_name: seerr
    image: ghcr.io/seerr-team/seerr:v3.0.0
    init: true
    restart: unless-stopped
    logging:
      driver: json-file
    environment:
      TZ: ${TZ:-Europe/Paris}
      LOG_LEVEL: info
    ports:
      - ${SEERR_PORT:-5055}:5055
    volumes:
      - /docker/appdata/seerr:/app/config
    dns:
      - 1.1.1.1
      - 1.0.0.1
    networks:
      - arr_plex
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s

###############################################
# JELLYFIN - Media Server
###############################################

  jellyfin:
    <<: *common-keys
    container_name: jellyfin
    image: linuxserver/jellyfin:10.10.6
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/appdata/jellyfin:/config
      - /data/media:/data/media:ro
    ports:
      - ${JELLYFIN_PORT:-8096}:8096
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

###############################################
# WATCHTOWER - Auto Updater
###############################################

  watchtower:
    container_name: watchtower
    profiles: ["infra"]
    image: containrrr/watchtower:1.17.0
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_SCHEDULE: "0 0 4 * * *"
      WATCHTOWER_NOTIFICATIONS: ""

###############################################
# ARR Stack Dedicated Network
###############################################

networks:
  arr_plex:
    name: arr_plex

###############################################
###############################################